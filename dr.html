<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>yastor - تقديم طلب</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>body { font-family: 'Tajawal', sans-serif; }</style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col items-center justify-center p-4">

    <main class="w-full max-w-md bg-white rounded-3xl shadow-2xl border border-slate-100 overflow-hidden">
        <!-- Header -->
        <div class="bg-gradient-to-r from-amber-600 to-amber-700 text-white p-8 text-center">
            <h1 class="text-4xl font-black tracking-wider mb-2">yastor</h1>
            <p class="text-amber-100 text-lg font-medium">bienvenue</p>
        </div>

        <!-- Form -->
        <form id="clientForm" class="p-6 space-y-5">
            <div>
                <label class="block text-sm font-bold text-slate-700 mb-1">الاسم الكامل</label>
                <input type="text" id="cName" required placeholder="أدخل اسمك" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-amber-500 outline-none">
            </div>

            <div>
                <label class="block text-sm font-bold text-slate-700 mb-1">رقم الهاتف</label>
                <input type="tel" id="cPhone" required placeholder="05XXXXXXXX" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-amber-500 outline-none">
            </div>

            <div>
                <label class="block text-sm font-bold text-slate-700 mb-1">تفاصيل الطلب / المنتجات</label>
                <textarea id="cOrder" rows="3" required placeholder="اكتب المنتجات المطلوبة هنا..." class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-amber-500 outline-none"></textarea>
            </div>

            <button type="submit" class="w-full bg-amber-600 hover:bg-amber-700 text-white font-bold py-4 rounded-xl shadow-lg transition transform active:scale-95">
                تأكيد وإرسال الطلب
            </button>
        </form>
    </main>

    <script>
        document.getElementById('clientForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const name = document.getElementById('cName').value;
            const phone = document.getElementById('cPhone').value;
            const details = document.getElementById('cOrder').value;

            // حفظ الطلب في قاعدة البيانات المحلية
            let orders = JSON.parse(localStorage.getItem('yastor_db_orders')) || [];
            orders.push({ id: Date.now(), name, phone, details, date: new Date().toLocaleTimeString('ar-DZ') });
            localStorage.setItem('yastor_db_orders', JSON.stringify(orders));

            alert('تم تسجيل طلبك بنجاح في yastor! شكراً لك.');
            document.getElementById('clientForm').reset();
        });
    </script>
</body>
</html>
