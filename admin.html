<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>yastor - لوحة تحكم الأدمن</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #0f172a; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 sm:p-6">

    <div class="max-w-4xl mx-auto">
        <header class="flex justify-between items-center mb-8 bg-slate-800 p-6 rounded-3xl border border-slate-700 shadow-xl">
            <div>
                <h1 class="text-2xl font-black text-amber-500">yastor - لوحة الأدمن</h1>
                <p class="text-slate-400 text-sm">متابعة وإدارة طلبات الزبائن</p>
            </div>
            <button onclick="clearOrders()" class="bg-rose-600 hover:bg-rose-700 text-white text-sm font-bold px-4 py-2 rounded-xl transition">
                حذف كل الطلبات
            </button>
        </header>

        <main class="bg-slate-800 rounded-3xl p-6 border border-slate-700 shadow-xl">
            <h2 class="text-lg font-bold mb-4 text-slate-200">الطلبات الواردة</h2>
            <div id="ordersList" class="space-y-4">
                <!-- يتم تعبئة الطلبات هنا تلقائياً -->
            </div>
        </main>
    </div>

    <script>
        function loadOrders() {
            const container = document.getElementById('ordersList');
            const orders = JSON.parse(localStorage.getItem('yastor_orders')) || [];

            if (orders.length === 0) {
                container.innerHTML = `<p class="text-center text-slate-500 py-8">لا توجد طلبات جديدة حالياً.</p>`;
                return;
            }

            container.innerHTML = orders.map((order, index) => `
                <div class="bg-slate-900/60 p-4 rounded-2xl border border-slate-700 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                    <div>
                        <span class="text-xs text-amber-400 font-semibold">طلب #${index + 1} - ${order.date}</span>
                        <h3 class="text-lg font-bold text-white mt-1">${order.name}</h3>
                        <p class="text-sm text-slate-300">الهاتف: <a href="tel:${order.phone}" class="text-amber-400 underline">${order.phone}</a></p>
                        <p class="text-sm text-slate-400 mt-2 bg-slate-900 p-3 rounded-xl border border-slate-800">الطلب: ${order.details}</p>
                    </div>
                </div>
            `).join('');
        }

        function clearOrders() {
            if(confirm('هل أنت متأكد من حذف جميع الطلبات؟')) {
                localStorage.removeItem('yastor_orders');
                loadOrders();
            }
        }

        loadOrders();
    </script>
</body>
</html>
