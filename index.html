<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>yastor - لوحة الأدمن الخاصة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>body { font-family: 'Tajawal', sans-serif; }</style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 sm:p-6">

    <!-- شاشة إدخال كلمة السر -->
    <div id="authScreen" class="max-w-md mx-auto mt-20 bg-slate-800 p-8 rounded-3xl border border-slate-700 text-center shadow-2xl">
        <h2 class="text-2xl font-bold text-amber-500 mb-2">yastor Admin</h2>
        <p class="text-slate-400 text-sm mb-6">يرجى إدخال رمز الحماية للوصول إلى لوحة التحكم</p>
        <input type="password" id="passInput" placeholder="أدخل كلمة السر" class="w-full text-center text-slate-900 font-bold px-4 py-3 rounded-xl mb-4 outline-none focus:ring-2 focus:ring-amber-500">
        <button onclick="checkPass()" class="w-full bg-amber-600 hover:bg-amber-700 font-bold py-3 rounded-xl shadow-lg transition transform active:scale-95">دخول</button>
    </div>

    <!-- لوحة التحكم الحقيقية (مخفية حتى إدخال رمز الحماية) -->
    <div id="adminPanel" class="max-w-4xl mx-auto hidden">
        <header class="flex justify-between items-center mb-6 bg-slate-800 p-6 rounded-3xl border border-slate-700 shadow-xl">
            <div>
                <h1 class="text-2xl font-black text-amber-500">لوحة تحكم yastor</h1>
                <p class="text-slate-400 text-xs mt-1">إدارة الطلبات الواردة من الزبائن</p>
            </div>
            <button onclick="clearAll()" class="bg-rose-600 hover:bg-rose-700 text-xs font-bold px-4 py-2 rounded-xl transition">حذف كل الطلبات</button>
        </header>

        <div id="ordersContainer" class="space-y-4"></div>
    </div>

    <script>
        const PASSWORD = "10092026"; // كلمة المرور الخاصة بك

        function checkPass() {
            const val = document.getElementById('passInput').value;
            if (val === PASSWORD) {
                document.getElementById('authScreen').classList.add('hidden');
                document.getElementById('adminPanel').classList.remove('hidden');
                loadOrders();
            } else {
                alert('كلمة السر غير صحيحة!');
            }
        }

        function loadOrders() {
            const container = document.getElementById('ordersContainer');
            const orders = JSON.parse(localStorage.getItem('yastor_db_orders')) || [];

            if (orders.length === 0) {
                container.innerHTML = `<p class="text-center text-slate-500 py-10">لا توجد طلبات مسجلة بعد.</p>`;
                return;
            }

            container.innerHTML = orders.map((o, index) => `
                <div class="bg-slate-800 p-5 rounded-2xl border border-slate-700 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 shadow-md">
                    <div>
                        <span class="text-xs font-bold text-amber-400">طلب #${index + 1} - الساعة ${o.date}</span>
                        <h3 class="text-xl font-bold text-white mt-1">${o.name}</h3>
                        <p class="text-sm text-slate-300">الهاتف: <a href="tel:${o.phone}" class="text-amber-400 font-bold underline">${o.phone}</a></p>
                        <p class="text-sm text-slate-300 mt-2 bg-slate-900/80 p-3 rounded-xl border border-slate-800">${o.details}</p>
                    </div>
                </div>
            `).join('');
        }

        function clearAll() {
            if(confirm('هل تريد حذف جميع الطلبات؟')) {
                localStorage.removeItem('yastor_db_orders');
                loadOrders();
            }
        }
    </script>
</body>
</html>
