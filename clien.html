<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>yastor - طلبات العملاء</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #f8fafc; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col items-center p-4">

    <!-- رأس الصفحة / ترحيب فاخر -->
    <header class="w-full max-w-md bg-gradient-to-r from-amber-600 to-amber-800 text-white p-6 rounded-3xl shadow-xl mb-6 text-center">
        <h1 class="text-3xl font-black tracking-wider mb-1">yastor</h1>
        <p class="text-amber-100 text-lg font-medium tracking-wide">bienvenue، نرحب بكم في متجرنا</p>
    </header>

    <!-- استمارة الطلب للعميل -->
    <main class="w-full max-w-md bg-white p-6 rounded-3xl shadow-md border border-slate-100">
        <h2 class="text-xl font-bold mb-4 text-slate-700 border-b pb-2">سجل طلبك بكل سهولة</h2>
        
        <form id="orderForm" class="space-y-4">
            <div>
                <label class="block text-sm font-semibold mb-1 text-slate-600">اسم الزبون الكريم</label>
                <input type="text" id="clientName" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-amber-600 outline-none transition" placeholder="أدخل اسمك الكامل">
            </div>

            <div>
                <label class="block text-sm font-semibold mb-1 text-slate-600">رقم الهاتف</label>
                <input type="tel" id="clientPhone" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-amber-600 outline-none transition" placeholder="05XXXXXXXX">
            </div>

            <div>
                <label class="block text-sm font-semibold mb-1 text-slate-600">المنتج المطلوب أو التفاصيل</label>
                <textarea id="orderDetails" rows="3" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-amber-600 outline-none transition" placeholder="اكتب تفاصيل طلبك هنا..."></textarea>
            </div>

            <button type="submit" class="w-full bg-amber-700 hover:bg-amber-800 text-white font-bold py-3.5 rounded-xl shadow-lg transition transform active:scale-95">
                إرسال الطلب الآن
            </button>
        </form>
    </main>

    <script>
        document.getElementById('orderForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const name = document.getElementById('clientName').value;
            const phone = document.getElementById('clientPhone').value;
            const details = document.getElementById('orderDetails').value;

            // حفظ الطلب محلياً لكي يظهر في لوحة الأدمن إذا كان في نفس الجهاز أو إرساله
            let orders = JSON.parse(localStorage.getItem('yastor_orders')) || [];
            orders.push({ name, phone, details, date: new Date().toLocaleString() });
            localStorage.setItem('yastor_orders', JSON.stringify(orders));

            alert('تم إرسال طلبك بنجاح يا ' + name + '! شكراً لاختيارك yastor.');
            document.getElementById('orderForm').reset();
        });
    </script>
</body>
</html>
